name: frame-forge

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      FORGE_DATA_DIR: /app/data
      FORGE_USE_STUB: "0"
      FORGE_REQUIRE_WORKER: "1"
      WORKER_HEARTBEAT_MAX_AGE_MS: "45000"
    ports:
      - "${FRAME_FORGE_PORT:-3000}:3000"
    volumes:
      - frame_forge_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
      args:
        IMG2THREEJS_GIT_REF: "${IMG2THREEJS_GIT_REF:-e8ff28a6ae0cb534c7b2ebc15cb3f06709262d5b}"
    restart: unless-stopped
    init: true
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in the production env file}"
      FORGE_DATA_DIR: /app/data
      WORKER_MODEL: "${WORKER_MODEL:-sonnet}"
      WORKER_MAX_USD: "${WORKER_MAX_USD:-2}"
      WORKER_RECOVER_RUNNING: "${WORKER_RECOVER_RUNNING:-1}"
      IMG2THREEJS_SKILL_DIR: /home/node/.claude/skills/img2threejs
    volumes:
      - frame_forge_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const h=JSON.parse(require('fs').readFileSync('/app/data/worker-health.json','utf8'));if(h.state==='stopping'||Date.now()-Date.parse(h.updatedAt)>45000)process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_grace_period: 30s

volumes:
  frame_forge_data:
